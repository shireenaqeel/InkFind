<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InkFind — {% block title %}Find your next tattoo{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="/"><span class="ink">Ink</span>Find</a>
      <span class="header-stamp">Est. 2026 · India</span>
      <nav class="nav">
        <a class="nav-link {% if active == 'search' %}active{% endif %}" href="/">Search</a>
        <a class="nav-link {% if active == 'generate' %}active{% endif %}" href="/generate">Generate</a>
        <a class="nav-link {% if active == 'tryon' %}active{% endif %}" href="/try-on">Try On</a>
        <a class="nav-link {% if active == 'guide' %}active{% endif %}" href="/guide">Guide</a>
        <a class="nav-link {% if active == 'favorites' %}active{% endif %}" href="/favorites">Favorites</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-star">✦</span>
      <a class="brand" href="/"><span class="ink">Ink</span>Find</a>
      <p class="footer-tag">Find your next tattoo. Generate it. See it on you — before you commit.</p>
      <p class="footer-fine">MVP · Running on mock data · Built for India · Est. 2026</p>
    </div>
  </footer>
</body>
</html>
